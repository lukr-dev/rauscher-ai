name: Deploy production

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # Releases merge dev into main; manual runs always deploy main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rauscher.ai
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
